plugins {
     id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def cap = variant.name.capitalize()
        tasks.matching { it.name == "merge${cap}Assets" }.configureEach {
            dependsOn("externalNativeBuild${cap}")
        }
    }
}

android {
    namespace = "org.heaps.template"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 2
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                //abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                //abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        release {
            def storePath = keystoreProps["storeFile"] ?: System.getenv("KEYSTORE_PATH")
            if (storePath) {
                storeFile rootProject.file(storePath)
                storePassword keystoreProps["storePassword"] ?: System.getenv("KEYSTORE_PASSWORD")
                keyAlias keystoreProps["keyAlias"] ?: System.getenv("KEY_ALIAS")
                keyPassword keystoreProps["keyPassword"] ?: System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version '4.1.2'
            }
        }

    }
    lint {
        abortOnError = false
    }

    sourceSets {
        main {
            java.srcDirs += "jni/SDL/android-project/app/src/main/java"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
